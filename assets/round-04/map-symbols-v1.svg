    <symbol id="stamina" viewBox="0 0 32 32"><path d="m18 3-11 15h8l-1 11 11-16h-8z" fill="#f4c95d" stroke="#4b3920" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="los-blocker" viewBox="0 0 32 32"><path d="m6 27 10-20 10 20z" fill="#69747e" stroke="#18232b" stroke-width="2"/><path d="M7 24 25 8M11 27 27 13" stroke="#e4ebeb" stroke-width="2"/></symbol>
  </defs>
</svg>
