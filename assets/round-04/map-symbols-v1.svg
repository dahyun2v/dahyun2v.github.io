    <symbol id="vision-hidden" viewBox="0 0 32 32"><path d="M4 13c5-7 10 2 14-2 4-5 8 0 10 2v10c-5 3-10-4-15 0-4 3-6-1-9 0z" fill="#54636c"/><path d="M7 17h18m-16 5h14" fill="none" stroke="#d8e0df" stroke-width="2"/></symbol>
