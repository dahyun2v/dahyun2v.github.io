<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">ROUND-04 전략 지도 심벌 v1</title>
  <desc id="desc">18x14 지도 화면에서 외부 use 참조로 쓰는 병종, 도시, 시야, 선택, 이동, 패주, 기력 심벌. 규칙과 숨은 적 정보는 포함하지 않는다.</desc>
  <defs>
    <style>
      .line{stroke:#18232b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .line-light{stroke:#f6f1de;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .paper{fill:#f6f1de}.ink{fill:#18232b}.gold{fill:#f4c95d}.red{fill:#c34a4a}.blue{fill:#477ea5}.green{fill:#4f8c67}.brown{fill:#9a704d}.slate{fill:#68747c}
    </style>

    <!-- Six troop classes: icon silhouettes have no number or hidden-stat encoding. -->
    <symbol id="unit-spear" viewBox="0 0 64 64"><path class="line paper" d="M17 55c0-14 6-21 15-21s15 7 15 21z"/><circle class="line brown" cx="32" cy="24" r="7"/><path class="line ink" d="M28 34h8v21h-8z"/><path class="line" fill="none" d="M48 56V7m0 0-5 9h10z"/></symbol>
    <symbol id="unit-cavalry" viewBox="0 0 64 64"><path class="line brown" d="M8 47c3-11 12-16 24-13l7-7 12 5 5 10-7 6H15z"/><path class="line paper" d="m43 29 5-8 8 3-5 8z"/><path class="line ink" d="m24 36 4-10h7l3 10zM21 50l-2 8m23-8 3 8"/><path class="line" fill="none" d="m20 31-6-8m0 0 6-1"/></symbol>
    <symbol id="unit-archer" viewBox="0 0 64 64"><path class="line paper" d="M17 55c1-14 6-21 15-21s14 7 15 21z"/><circle class="line brown" cx="32" cy="23" r="7"/><path class="line ink" d="M28 34h8v21h-8z"/><path class="line" fill="none" d="M47 17c-15 5-15 21 0 27m0-27L35 44m13-27-19 25"/></symbol>
    <symbol id="unit-engineer" viewBox="0 0 64 64"><path class="line" fill="#cbb38d" d="m8 51 12-21 12 7-10 18zM35 37l9-11 12 10-10 12z"/><path class="line ink" d="M18 49h31v8H18z"/><path class="line" fill="none" d="m20 30 15-15m0 0-4 8 9 1"/><path class="line red" d="m43 20 5 4-4 5-5-4z"/></symbol>
    <symbol id="unit-medic" viewBox="0 0 64 64"><path class="line paper" d="M17 55c1-14 6-21 15-21s14 7 15 21z"/><circle class="line brown" cx="32" cy="23" r="7"/><path class="line ink" d="M28 34h8v21h-8z"/><path class="line green" d="M45 11h7v9h8v7h-8v9h-7v-9h-8v-7h8z"/></symbol>
    <symbol id="unit-caster" viewBox="0 0 64 64"><path class="line" fill="#e8e0bc" d="M17 55c1-14 6-21 15-21s14 7 15 21z"/><circle class="line brown" cx="32" cy="23" r="7"/><path class="line ink" d="M28 34h8v21h-8z"/><path class="line" fill="none" d="M48 55V13m0 0 7 8-7 4-7-4zm-8 0h16"/><path class="line gold" d="M26 9h13v9H26z"/></symbol>

    <symbol id="city" viewBox="0 0 64 64"><path class="line" fill="#b8aca0" d="M8 55V29l12-9 11 9 12-13 13 13v26z"/><path class="line" fill="#d9c590" d="M15 33h11v22H15zm24-4h12v26H39z"/><path class="line" fill="none" d="M11 55h44M21 20V9m-4 4h8M45 16V7m-4 4h8"/><path class="line red" d="M31 20v-9h14l-4 5 4 4z"/></symbol>
    <symbol id="vision-visible" viewBox="0 0 32 32"><path d="M3 16s5-9 13-9 13 9 13 9-5 9-13 9S3 16 3 16z" fill="#9ce0d4" stroke="#183737" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="#183737"/></symbol>
